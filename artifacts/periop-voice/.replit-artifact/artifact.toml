kind = "web"
previewPath = "/"
title = "PeriOp Voice"
version = "1.0.0"
id = "artifacts/periop-voice"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22475

[services.development]
run = "pnpm --filter @workspace/periop-voice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/periop-voice", "run", "build" ]
publicDir = "artifacts/periop-voice/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22475"
BASE_PATH = "/"
